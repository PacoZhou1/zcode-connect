name: ZCodeMobile
options:
  bundleIdPrefix: dev.paco
  developmentLanguage: en
  knownRegions: [en, zh-Hans, ja, fr, ko, de]
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.6"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ZCODE_APP_BUNDLE_ID: dev.paco.zcode.mobile
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: "1.2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: zcode connect
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your computer to view and continue ZCode tasks.
    INFOPLIST_KEY_NSCameraUsageDescription: Scan the connection QR code on your computer or take photos for a task.
    INFOPLIST_KEY_NSMicrophoneUsageDescription: Turn your voice into task instructions.
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Convert speech into editable text for you to review before sending.
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose photos to attach to a task.
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  ZCodeMobile:
    type: application
    platform: iOS
    sources:
      - path: ZCodeMobile
        excludes: ["Core/Mirror", "Features/MirrorViews.swift", "Core/Relay/*.md", "Core/Relay/*.sh", "Core/RelayAdapter/*.md", "Core/RelayAdapter/*.sh"]
    info:
      path: ZCodeMobile/Resources/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(ZCODE_APP_BUNDLE_ID)"
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": ZCodeMobile/Resources/Simulator.entitlements
  ZCodeMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ZCodeMobileTests]
    dependencies:
      - target: ZCodeMobile
  ZCodeMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ZCodeMobileUITests
        excludes: ["MirrorViewportTests.swift"]
    dependencies:
      - target: ZCodeMobile
schemes:
  ZCodeMobile:
    build:
      targets:
        ZCodeMobile: all
    test:
      targets:
        - ZCodeMobileTests
        - ZCodeMobileUITests
